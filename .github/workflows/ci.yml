name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check all lists
        run: npm test
      - name: Run the official awesome-lint on the main list
        run: npx awesome-lint
        env:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Pull requests check only the links they add to the lists; the weekly (or manual) run checks every list link.
  # The library catalogs in lists/*/biblioteca hold thousands of file links and are checked when they are generated.
  # Pushes to main skip this job, since their links were already checked in the pull request.
  links:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select links
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff -U0 "origin/$BASE...HEAD" -- README.md ':(glob)lists/*/README.md' | grep '^+[^+]' | grep -oE 'https?://[^ )>"]+' | sort -u > added-links.txt || true
            if [ -s added-links.txt ]; then files="added-links.txt"; else files=""; fi
          else
            files="README.md lists/*/README.md"
          fi
          echo "list=$files" >> "$GITHUB_OUTPUT"
      - name: Check links
        if: steps.files.outputs.list != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: ${{ steps.files.outputs.list }}
          fail: true
